# release.yml - Pubblicazione Release di LIBRI (solo ZIP del codice).
#
# Responsabilita' minime:
#   1. creare la Release GitHub al push di un tag v*;
#   2. allegare la guida PDF all'installazione (docs/GUIDA_INSTALLAZIONE.pdf).
# Gli utenti scaricano 'Source code (zip)' generato automaticamente da GitHub:
# non vengono piu' costruiti eseguibili .exe ne' installer.

name: Pubblica release

on:
  push:
    tags:
      - "v*"   # es. v0.5.0 -> pubblica automaticamente la release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4

      - name: Crea Release con guida e sorgenti
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            docs/GUIDA_INSTALLAZIONE.pdf

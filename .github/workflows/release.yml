# release.yml - Build Windows dell'app LIBRI e pubblicazione della Release.
#
# Responsabilita' minime:
#   1. costruire l'exe con PyInstaller (libri.spec);
#   2. impacchettare il bundle in uno ZIP portable;
#   3. compilare l'installer Inno Setup (LIBRI-Setup-<versione>.exe);
#   4. creare la Release GitHub con allegati .exe + .zip, al push del tag v*.
#
# Permessi usati: contents: write (basta il GITHUB_TOKEN predefinito).

name: Pubblica release Windows

on:
  push:
    tags:
      - "v*"   # es. v0.5.0 -> pubblica automaticamente la release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.ref_name }}   # es. v0.5.0

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4

      - name: Installa Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (PyInstaller)
        run: pyinstaller libri.spec --noconfirm

      - name: Verifica che LIBRI.exe esista
        run: Test-Path dist\LIBRI\LIBRI.exe

      - name: ZIP portable (bundle senza installer)
        run: Compress-Archive -Path dist\LIBRI\* -DestinationPath LIBRI-${{ env.APP_VERSION }}-portable.zip

      - name: Compila installer Inno Setup
        uses: jrsoftware/setup-inno-setup@v1
        with:
          path: installer\LIBRI.iss
          output: dist\LIBRI-Setup-${{ env.APP_VERSION }}.exe

      - name: Crea Release con allegati .exe e .zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/LIBRI-Setup-${{ env.APP_VERSION }}.exe
            LIBRI-${{ env.APP_VERSION }}-portable.zip
